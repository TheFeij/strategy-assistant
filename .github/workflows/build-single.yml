name: Build single-file HTML

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and upload artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file HTML
        run: npm run build:single

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: strategy-assistant-html
          path: dist/index.html
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish to GitHub Releases
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built HTML
        uses: actions/download-artifact@v4
        with:
          name: strategy-assistant-html
          path: release

      - name: Name release asset
        run: mv release/index.html release/strategy-assistant.html

      - name: Publish HTML to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          body: |
            Self-contained build of StratBI Pro, downloadable as a single HTML file.

            - Commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            - Built by: ${{ github.workflow }} run #${{ github.run_number }}
          files: release/strategy-assistant.html
          make_latest: true
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/') }}
